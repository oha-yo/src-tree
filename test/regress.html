<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>src-tree 回帰テスト</title>
<link rel="stylesheet" href="../src-tree.css">
<style>
body{margin:0;padding:16px 20px;background:#f6f7f9;color:#222;font-family:"Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
h1{font-size:18px;margin:0 0 8px}
.result{font-size:15px;font-weight:bold;margin:8px 0}
.ok{color:#1a7f37}.ng{color:#cf222e}
pre{background:#fff;border:1px solid #d8dce2;border-radius:6px;padding:8px;font-size:12px;max-height:400px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>src-tree 回帰テスト</h1>
<p>試験用のプロジェクト（<code>sample-data.js</code>）を読み込んで、決まった操作をし、結果を <code>expected.json</code> と比べます。<br>
ローカルのサーバーで開いてください（例：<code>python -m http.server</code> で src-tree のフォルダを公開して <code>/test/regress.html</code>）。<br>
動きを意図して変えたときは、<code>?update</code> を付けて開き、出てきた JSON を <code>expected.json</code> に保存し直します。</p>
<div class="result">実行中…</div>
<pre class="log"></pre>

<div class="src-tree-tool"></div>
<script src="../src-tree.js"></script>
<script src="sample-data.js"></script>
<script src="regress.js"></script>
</body>
</html>
